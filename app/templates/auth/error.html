{% extends 'base.html' %}
{% block title %}Sign-in failed{% endblock %}

{% block content %}
  <section class="panel">
    <h2>Sign-in failed</h2>
    <p>Microsoft sign-in did not complete{% if error %} ({{ error }}){% endif %}.</p>
    <p><a href="{{ url_for('auth.login') }}">Try again</a></p>
  </section>
{% endblock %}
